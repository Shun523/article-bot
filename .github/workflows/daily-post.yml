name: Daily Qiita Article Post

on:
  schedule:
    - cron: '0 22 * * *'  # 毎日 7:00 JST (= 22:00 UTC 前日)
  workflow_dispatch:       # 手動実行も可能

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Post article to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python article.py

      - name: Save queue state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly_queue.json
          git diff --staged --quiet || git commit -m "chore: update weekly queue [skip ci]"
          git push
